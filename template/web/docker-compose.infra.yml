name: ${PROJECT_NAME:-myapp}-infra

services:
  traefik:
    profiles:
      - infra
    image: traefik:v3
    container_name: traefik-${PROJECT_NAME:-myapp}
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HOST:-127.0.0.1}:${TRAEFIK_PORT:-9876}:80"
    volumes:
      - ./.container/traefik:/etc/traefik/dynamic:ro
    networks:
      - devnet
    restart: unless-stopped

  # Add project-specific shared services when needed.
