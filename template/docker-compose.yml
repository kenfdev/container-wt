# =============================================================================
# Shared infrastructure services — started independently on the host.
#
# Run: docker compose up -d    (from project root)
# This is completely decoupled from app containers.
#
# CUSTOMIZE: Add your own infrastructure services (Postgres, Redis, etc.)
# =============================================================================

name: ${PROJECT_NAME:-myapp}-infra

services:
  traefik:
    image: traefik:v3
    container_name: "traefik-${PROJECT_NAME:-myapp}"
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.localport.address=:80
      - --api.insecure=true
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./.worktree/traefik:/etc/traefik/dynamic:ro
    networks:
      - devnet
    restart: unless-stopped

  # Example infrastructure services.
  # Uncomment and adapt for your project's needs.

